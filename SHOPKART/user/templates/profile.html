{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card">

                <div class="card-body">

                    <h3>
                        👤 My Profile
                    </h3>

                    <hr>

                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label>
                                Username
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                value="{{ user.username }}"
                                disabled
                            >

                        </div>


                        <div class="mb-3">

                            <label>
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                value="{{ user.email }}"
                            >

                        </div>


                        <div class="mb-3">

                            <label>
                                Phone
                            </label>

                            <input
                                type="text"
                                name="phone"
                                class="form-control"
                                value="{{ profile.phone }}"
                            >

                        </div>


                        <div class="mb-3">

                            <label>
                                Address
                            </label>

                            <textarea
                                name="address"
                                class="form-control"
                            >{{ profile.address }}</textarea>

                        </div>


                        <div class="row">

                            <div class="col-md-4">

                                <input
                                    type="text"
                                    name="city"
                                    class="form-control"
                                    placeholder="City"
                                    value="{{ profile.city }}"
                                >

                            </div>


                            <div class="col-md-4">

                                <input
                                    type="text"
                                    name="state"
                                    class="form-control"
                                    placeholder="State"
                                    value="{{ profile.state }}"
                                >

                            </div>


                            <div class="col-md-4">

                                <input
                                    type="text"
                                    name="pincode"
                                    class="form-control"
                                    placeholder="Pincode"
                                    value="{{ profile.pincode }}"
                                >

                            </div>

                        </div>


                        <button
                            class="btn btn-primary mt-4 w-100"
                        >
                            Save Profile
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
