{% extends "base.html" %}

{% block title %}
Login | ShopKart
{% endblock %}


{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4">

                    <h2 class="text-center mb-4">
                        Login
                    </h2>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Username -->

                        <div class="mb-3">

                            <label class="form-label">
                                Username
                            </label>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter username"
                                required
                            >

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter password"
                                required
                            >

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>


                    </form>


                    <div class="text-center mt-4">

                        <span>
                            Don't have an account?
                        </span>

                        <a href="{% url 'register' %}">
                            Create Account
                        </a>

                    </div>


                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
