{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card">

                <div class="card-body">

                    <h3>
                        Return Order #{{ order.id }}
                    </h3>

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label>
                                Reason for return
                            </label>

                            <textarea
                                name="reason"
                                class="form-control"
                                rows="5"
                                required
                            ></textarea>

                        </div>

                        <button
                            class="btn btn-danger"
                        >
                            Submit Return Request
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
